<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Project</title>
  <style>
    /* 
    Write your CSS here 
    Gap Colour: #000
    White: #F0F1EC
    Red: #E72F24
    Black: #232629
    Blue: #004592
    Yellow: #F9D01E

    For dimensions, see dimensions.png image.
    HINT: Remember you can't change the properties of grid lines.
    But grid lines are transparent!
    */

    body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    }

    .container{
      display: grid;
      grid-template-columns: 320px 198px 153px 50px;
      grid-template-rows: 414px 130px 155px 20px;
      gap:9px;
      background-color: black;
      height: 748px;
      width: 748px;
    }

    .first{
      background-color: red;
      grid-column: 1/2;
      grid-row: 1/2;
    }

    .second{
      background-color: #949a7a;
      grid-column: 2/5;
      grid-row: 1/2;
    }

    .third{
      background-color: #949a7a;
      grid-column: 1/2;
      grid-row: 2/4;
    }

    .fourth{
      background-color: #949a7a;
      grid-column: 2/4;
      grid-row: 2/4;
    }

    .fifth{
      background-color: #004592;
      grid-column: 4/5;
      grid-row : 2/3;
    }

    .sixth{
      background-color: #F9D01E;
      grid-column: 2/3;
      grid-row: 4/5;
    }

    .seventh{
      background-color: #949a7a;
      grid-column: 1/2;
      grid-row: 4/5;
    }

    .eigth{
      background-color: #949a7a;
      grid-column: 4/5;
      grid-row: 3/5;
    }

  </style>
</head>

<body>
  <!-- Write your HTML here -->
   <div class="container">
    <div class="first"></div>
    <div class="second"></div>
    <div class="third"></div>
    <div class="fourth"></div>
    <div class="fifth"></div>
    <div class="sixth"></div>
    <div class="seventh"></div>
    <div class="eigth"></div>
   </div>
</body>

</html>
